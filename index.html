<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>포토부스</title>
<style>
  :root{
    --bg:#fff; --card:#fff; --fg:#000; --dim:#6b6b6b;
    --line:#000; --accent:#f4f4f2; --primary:#000;
    --r-xl:0px; --r-lg:0px; --r-md:0px; --r-sm:0px;
    --dur:200ms; --ease:cubic-bezier(0.22,1,0.36,1);
    --shadow:none;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    -webkit-user-select:none; user-select:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .screen{min-height:100%; display:none; flex-direction:column; align-items:center;
    justify-content:flex-start; gap:18px; padding:32px 24px 40px; overflow-y:auto}
  .screen.on{display:flex}

  header{text-align:center}
  .mark{font-size:34px; letter-spacing:.04em; font-weight:800; color:var(--fg)}
  .tag{font-size:13px; color:var(--dim); margin-top:8px}

  .panel{width:100%; max-width:560px; background:var(--card); border:1px solid var(--line);
    border-radius:var(--r-xl); box-shadow:var(--shadow); padding:20px; display:flex; flex-direction:column}

  .stage{position:relative; width:100%; aspect-ratio:3/2; border-radius:var(--r-lg); overflow:hidden;
    background:#000; border:1px solid var(--line)}
  video{width:100%; height:100%; object-fit:cover; transform:scaleX(-1)}
  .guide{position:absolute; inset:0; width:100%; height:100%; pointer-events:none} /* 테마가 그리는 촬영 가이드(출연자 자리·잘리는 영역) */
  .count{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:140px; font-weight:700; color:#fff; text-shadow:0 4px 40px rgba(0,0,0,.7);
    background:rgba(0,0,0,.2); pointer-events:none}
  .progress{position:absolute; top:14px; left:14px; font-size:14px; letter-spacing:.25em;
    color:#fff; background:rgba(0,0,0,.55); padding:6px 13px; display:none}
  .flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none}
  .flash.on{animation:flash 340ms var(--ease)}
  @keyframes flash{0%{opacity:.95}100%{opacity:0}}

  .lab{font-size:12px; letter-spacing:.02em; color:var(--dim); margin:22px 0 11px; font-weight:500}
  .row{display:flex; gap:9px; flex-wrap:wrap}
  .chip{flex:1 1 0; min-width:80px; background:var(--accent); border:1px solid var(--chip,var(--line)); color:var(--chip,var(--dim));
    border-radius:var(--r-md); padding:14px 8px; font-size:15px; font-family:inherit; cursor:pointer; text-align:center; font-weight:500;
    transition:color var(--dur) var(--ease), background var(--dur) var(--ease), border-color var(--dur) var(--ease)}
  .chip[aria-pressed="true"]{color:#fff; background:var(--chip,var(--fg)); border-color:var(--chip,var(--fg))}
  .chip small{display:block; font-size:11px; margin-top:4px; white-space:nowrap} /* 둘째 줄(sub) — 항상 한 줄 */

  .btn{width:100%; max-width:560px; padding:18px; border:none; border-radius:var(--r-md); font-size:17px; font-weight:600;
    font-family:inherit; cursor:pointer; letter-spacing:.02em; transition:opacity var(--dur) var(--ease)}
  .btn-go{background:var(--primary); color:#fff}
  .btn-go.full{margin-top:18px}
  .btn-ghost{background:var(--card); color:var(--fg); border:1px solid var(--line); margin-top:10px}
  .btn:disabled{opacity:.45}
  .chip:focus-visible,.btn:focus-visible{outline:none; box-shadow:0 0 0 3px rgba(0,0,0,.12)}

  .preview-wrap{display:flex; justify-content:center; margin-top:4px}
  #preview{height:300px; max-width:100%; border:1px solid var(--line); background:var(--accent)}

  /* 미리보기 옆 배치(테마 preview:'side') — 왼쪽 열에 패널+START, 오른쪽 열에 미리보기. 세로 아이패드 한 화면에 다 들어가 스크롤이 없다 */
  body[data-preview="side"] .capmain{display:grid; grid-template-columns:minmax(0,1fr) 300px; column-gap:20px; max-width:none; width:100%; align-items:start}
  body[data-preview="side"] .capmain>header{grid-area:head}
  body[data-preview="side"] #capScreen .capmain{grid-template-rows:auto 1fr auto; grid-template-areas:"head head" "panel pv" "btn pv"}
  body[data-preview="side"] .capmain>.panel:not(#pv){grid-area:panel; max-width:none} /* 열 폭을 꽉 채워 START와 같은 폭 */
  body[data-preview="side"] #shoot{grid-area:btn; align-self:end; max-width:none}
  body[data-preview="side"] #pv{grid-area:pv}
  body[data-preview="side"] #pv .lab{margin-top:0}
  body[data-preview="side"] #preview{width:100%; height:auto}
  /* 결과 화면 — 왼쪽 스트립, 오른쪽 열에 QR·SAVE·다시 찍기(전부 열 폭 = 같은 크기) */
  body[data-preview="side"] #resScreen .capmain{grid-template-areas:"head head" "strip side"; grid-template-columns:auto 300px; justify-content:center} /* 스트립 폭만큼만 열을 잡고 가운데로 — QR과 바짝 */
  body[data-preview="side"] .result-body{grid-area:strip; padding:0; align-items:flex-start}
  body[data-preview="side"] #strip{max-height:calc(100vh - 290px)}
  body[data-preview="side"] #side{grid-area:side; max-width:none}
  body[data-preview="side"] #qrbox{width:100%; max-width:none; min-height:120px; justify-content:center}
  body[data-preview="side"] #qrimg svg{width:100%; max-width:260px}
  @media(max-width:600px){ body[data-preview="side"] .capmain{grid-template-columns:minmax(0,1fr); row-gap:18px}
    body[data-preview="side"] #capScreen .capmain{grid-template-areas:"head" "panel" "pv" "btn"}
    body[data-preview="side"] #resScreen .capmain{grid-template-areas:"head" "strip" "side"} }

  /* 좌 브랜드 컬럼 + 우 콘텐츠. 테마가 brand를 안 주면 컬럼은 사라진다 */
  .capwrap{display:flex; gap:32px; align-items:flex-start; justify-content:center; width:100%; max-width:900px; margin:0 auto}
  .brand{flex:0 0 280px; display:flex; flex-direction:column; align-items:center; gap:16px}
  .brand:empty{display:none}
  .brand img{display:block; width:100%; height:auto}
  .capmain{flex:1 1 auto; min-width:0; max-width:560px; display:flex; flex-direction:column; align-items:center}
  @media(max-width:860px){
    .capwrap{flex-direction:column; align-items:center; gap:16px}
    .brand{flex:0 0 auto; max-width:230px}
  }

  .result-body{flex:1; display:flex; align-items:center; justify-content:center; padding:4px 0; width:100%}
  #strip{max-width:100%; max-height:60vh; border:1px solid var(--line)}

  .side{width:100%; max-width:560px; display:flex; flex-direction:column; align-items:center} /* QR + SAVE + 다시 찍기 묶음 */
  .qrbox{display:flex; flex-direction:column; align-items:center; gap:8px; min-height:26px}
  #qrimg{display:none}
  #qrimg svg{width:170px; height:auto; display:block}
  .qrcap{font-size:13px; color:var(--dim); text-align:center}

  .err{color:var(--dim); font-size:14px; text-align:center; line-height:1.7; padding:30px}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important; transition:none!important}}
</style>
</head>
<body>

<section class="screen on" id="capScreen">
  <div class="capwrap">
    <aside class="brand"></aside>
    <div class="capmain">
  <header><div class="mark">PHOTO BOOTH</div><div class="tag">테마를 고르면 4컷을 자동으로 찍어드려요</div></header>
  <div class="panel">
    <div class="stage">
      <video id="cam" autoplay playsinline muted></video>
      <canvas class="guide" id="guide"></canvas>
      <div class="flash" id="flash"></div>
      <div class="progress" id="prog"></div>
      <div class="count" id="count" style="display:none"></div>
    </div>
    <div class="err" id="err" style="display:none"></div>

    <p class="lab">필터</p>
    <div class="row" id="filters"></div>
    <p class="lab">프레임</p>
    <div class="row" id="frames"></div>

    <p class="lab">문구</p>
    <div class="row" id="phrases"></div>

    <div id="pv">
      <p class="lab">미리보기</p>
      <div class="preview-wrap"><canvas id="preview"></canvas></div>
    </div>
  </div>
  <button class="btn btn-go full" id="shoot">START</button>
    </div>
  </div>
</section>

<section class="screen" id="resScreen">
  <div class="capwrap">
    <aside class="brand"></aside>
    <div class="capmain">
  <header><div class="mark">PHOTO BOOTH</div><div class="tag">QR을 찍어 가져가거나 SAVE로 저장하세요</div></header>
  <div class="result-body"><canvas id="strip"></canvas></div>
  <div class="side" id="side">
    <div class="qrbox" id="qrbox"><div id="qrimg"></div><div class="qrcap" id="qrcap"></div></div>
    <button class="btn btn-go full" id="download">SAVE · PNG 저장</button>
    <button class="btn btn-ghost" id="retake">다시 찍기</button>
  </div>
    </div>
  </div>
</section>

<script src="qrcode.js"></script>
<script type="module">
// ── QR 다운로드 설정 (Cloudinary 무서명 업로드) ──────────────
// 둘 중 하나라도 비우면 QR 대신 안내만 뜨고, SAVE(로컬 저장)는 항상 동작.
const CLOUD_NAME='disdmlod';   // Cloudinary Cloud name
const UPLOAD_PRESET='jebs-pb'; // Unsigned upload preset — 행사별로 새로 만들면 폴더가 분리됨

const FILTERS=[
  {id:'original', name:'오리지널', css:'none'},
  {id:'mono',     name:'흑백',     css:'grayscale(1) contrast(1.08)'},
  {id:'haduri',   name:'하두리',   css:'brightness(1.35) contrast(0.8) saturate(1.12) blur(0.5px)', lo:0.42},
];
const SHOTS=4, PW=400, PH=267, PAD=24, GAP=14, FOOT=82, DPR=3;

// ── 테마 로드 ──────────────────────────────────────────────────────
// ?theme=<폴더명> → themes/<폴더명>/theme.js. 없거나 못 읽으면 base로 떨어진다.
// 테마 계약: {name, slug, frames:[{id,name,sub?,color?,bg,txt}], defaultFrame?, phrases:[], css?, preview?:'side', labels?:{filters,frames,phrases,preview}}
const THEME_ID=new URLSearchParams(location.search).get('theme')||'base';
const asset=p=>`themes/${THEME_ID}/${p}`; // 테마 폴더 기준으로 경로 해석
let T, themeErr=false;
try{ T=(await import(`./themes/${THEME_ID}/theme.js`)).default; }
catch(e){ themeErr=true; T=(await import('./themes/base/theme.js')).default; }
if(T.css) document.head.insertAdjacentHTML('beforeend',`<link rel="stylesheet" href="${asset(T.css)}">`);
document.title=T.name;
document.querySelectorAll('.mark').forEach(el=>el.textContent=T.name);
const IMG={}; // 테마가 선언한 이미지를 미리 띄워둔다. draw()에서 g.img.<키>로 쓴다
for(const [k,path] of Object.entries(T.images||{})){ const i=new Image(); i.src=asset(path); IMG[k]=i; }
// 화면 좌측 브랜드 컬럼 — 테마가 세울 이미지 목록
if(T.brand?.length) document.querySelectorAll('.brand').forEach(el=>
  el.innerHTML=T.brand.map(p=>`<img src="${asset(p)}" alt="">`).join(''));
if(themeErr) document.querySelector('#capScreen .tag').textContent=`'${THEME_ID}' 테마를 못 찾아 기본 테마로 엽니다`;
// 테마가 preview:'side'면 미리보기를 패널 밖으로 꺼내 오른쪽 열에 세운다(CSS는 위 data-preview 규칙)
if(T.preview==='side'){ const pv=document.getElementById('pv'); pv.classList.add('panel'); pv.closest('.capmain').append(pv); document.getElementById('qrbox').classList.add('panel'); document.body.dataset.preview='side'; } // 결과 화면의 QR도 패널로

// 칸 이름 바꾸기 — 테마가 labels:{filters,frames,phrases,preview}를 주면 그 글자로
const LAB={filters:'#filters', frames:'#frames', phrases:'#phrases', preview:'#pv .preview-wrap'};
for(const [k,txt] of Object.entries(T.labels||{})){ const el=document.querySelector(LAB[k]); if(el) el.previousElementSibling.textContent=txt; }

const FX=T.filters||FILTERS;   // 테마가 자기 필터를 주면 그걸 쓴다(기본 목록은 건드리지 않는다)
let filter=FX[0], frame=T.frames.find(f=>f.id===T.defaultFrame)||T.frames[0], phrase=T.phrases?.[0]||'', shots=[]; // defaultFrame: 처음 골라져 있을 프레임 id

const $=id=>document.getElementById(id);
const video=$('cam'), flash=$('flash'), count=$('count'), prog=$('prog');

function chips(host, list, render, onPick, sel=0){
  list.forEach((t,i)=>{
    const b=document.createElement('button');
    b.className='chip'; b.setAttribute('aria-pressed', i===sel); b.innerHTML=render(t);
    if(t.id) b.dataset.id=t.id; // 테마 CSS가 특정 칩만 다르게 놓을 수 있게(예: 한 칸을 가로로 꽉 채움)
    if(t.color) b.style.setProperty('--chip', t.color); // 칩 색(테두리·글자, 고르면 채움) — 계열 구분용
    b.onclick=()=>{ onPick(t); [...host.children].forEach((c,j)=>c.setAttribute('aria-pressed', j===i)); };
    host.appendChild(b);
  });
}
const label=t=>t.sub?`${t.name}<small>${t.sub}</small>`:t.name; // sub가 있으면 둘째 줄에 작게
chips($('filters'), FX, label, t=>{filter=t; video.style.filter=t.css; document.body.dataset.filter=t.id; updatePreview();});
document.body.dataset.filter=filter.id; // 테마 CSS가 필터별로 라이브뷰 위에 효과를 얹을 수 있게
// 프레임이 하나뿐인 테마는 FRAME 칸도 숨긴다(고를 게 없는 칩 한 개를 안 보이게)
if(T.frames.length>1) chips($('frames'), T.frames, label, t=>{frame=t; updatePreview(); drawGuide(0);}, T.frames.indexOf(frame));
else{ const r=$('frames'); r.previousElementSibling.remove(); r.remove(); }
// 문구를 안 쓰는 테마는 MESSAGE 칸을 통째로 없앤다(빈 칸이 남지 않게)
if(T.phrases?.length) chips($('phrases'), T.phrases, t=>t||'없음', t=>{phrase=t; updatePreview();});
else{ const r=$('phrases'); r.previousElementSibling.remove(); r.remove(); }

(async()=>{
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1920},height:{ideal:1080}},audio:false});
    video.srcObject=stream; video.onloadedmetadata=()=>drawGuide(0);
  }catch(e){
    $('err').style.display='block'; $('err').innerHTML='카메라 권한이 필요해요.<br>iPad 설정 > Safari > 카메라에서 허용해 주세요.';
    $('shoot').disabled=true;
  }
})();

const wait=ms=>new Promise(r=>setTimeout(r,ms));

// 촬영 가이드 — 테마가 guide()를 주면 i번째 컷에 맞춰 라이브뷰 위에 그린다(출연자 반투명·잘리는 영역)
function drawGuide(i){
  const g=$('guide'); if(!T.guide){ g.width=g.height=0; return; }
  const r=g.getBoundingClientRect(); g.width=Math.round(r.width*2); g.height=Math.round(r.height*2);
  const x=g.getContext('2d'); x.clearRect(0,0,g.width,g.height);
  T.guide(x, {i, W:g.width, H:g.height, frame, img:IMG});
}

function drawCover(ctx,dw,dh){
  const vw=video.videoWidth, vh=video.videoHeight;
  const s=Math.max(dw/vw,dh/vh), sw=dw/s, sh=dh/s, sx=(vw-sw)/2, sy=(vh-sh)/2;
  ctx.save(); ctx.translate(dw,0); ctx.scale(-1,1);
  ctx.imageSmoothingQuality='high';
  ctx.filter=filter.css==='none'?'none':filter.css;
  ctx.drawImage(video, sx,sy,sw,sh, 0,0,dw,dh); ctx.restore();
}
function snap(){
  const lr=filter.lo||1; // 보통은 풀해상도, 하두리만 저해상도로 떠서 복고 느낌
  const cw=Math.round(PW*DPR*lr), ch=Math.round(PH*DPR*lr);
  const c=document.createElement('canvas'); c.width=cw; c.height=ch;
  drawCover(c.getContext('2d'), cw, ch); return c;
}

let busy=false;
function updatePreview(){
  if(busy) return;
  if(!video.videoWidth){ compose($('preview'), []); return; } // 카메라가 뜨기 전(또는 거부)엔 빈 컷으로 프레임만 보여준다
  const s=snap();
  compose($('preview'), Array(SHOTS).fill(s));
}

async function shoot(){
  busy=true;
  $('shoot').disabled=true; shots=[]; prog.style.display='block';
  let pending=null;
  for(let i=0;i<SHOTS;i++){
    drawGuide(i);
    prog.textContent=`${i+1} / ${SHOTS}`; count.style.display='flex';
    for(let n=3;n>0;n--){ count.textContent=n; await wait(800); }
    count.textContent='●'; await wait(150);
    flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
    shots.push(snap()); count.style.display='none';
    if(i===SHOTS-1){ compose(); pending=(CLOUD_NAME&&UPLOAD_PRESET)?startUpload():null; } // 마지막 컷 직후 업로드 시작(대기와 겹침)
    await wait(550);
  }
  prog.style.display='none'; $('shoot').disabled=false; busy=false;
  drawGuide(0); show('resScreen'); makeQR(pending);
}

function startUpload(){ // 스트립을 JPEG로 인코딩 후 업로드 → secure_url 반환(진행 중 Promise)
  return new Promise(r=>$('strip').toBlob(r,'image/jpeg',0.9))
    .then(blob=>{ const fd=new FormData(); fd.append('file',blob); fd.append('upload_preset',UPLOAD_PRESET);
      return fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,{method:'POST',body:fd}); })
    .then(res=>{ if(!res.ok) throw new Error(res.status); return res.json(); })
    .then(j=>j.secure_url);
}
async function makeQR(pending){
  const img=$('qrimg'), cap=$('qrcap');
  img.style.display='none';
  if(!CLOUD_NAME || !UPLOAD_PRESET){ cap.textContent='QR: Cloudinary 설정 후 사용 가능 (SAVE는 지금도 됨)'; return; }
  cap.textContent='업로드 중…';
  try{
    const url=await (pending||startUpload()); // 촬영 중 미리 시작한 업로드가 있으면 그걸 기다림
    const base=location.href.replace(/[^/]*(\?.*)?$/,''); // 현재 폴더 URL
    const page=base+'d.html?img='+encodeURIComponent(url);
    const q=qrcode(0,'M'); q.addData(page); q.make();
    img.innerHTML=q.createSvgTag({cellSize:7, margin:16, scalable:true});
    img.style.display='block'; cap.textContent='';
  }catch(e){ cap.textContent='업로드 실패 · 아래 SAVE로 저장하세요'; }
}

function letterSpace(s,n){ return s.split('').join(' '.repeat(n)); }

function compose(cv=$('strip'), list=shots){
  const date=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\.$/,'');
  // 테마가 compose()를 주면 캔버스 크기·배치·배경까지 통째로 가져간다(아래 기본 스트립은 건너뜀)
  if(T.compose) return T.compose(cv, list, {frame,filter,phrase,date,img:IMG,letterSpace});
  const foot=T.foot||FOOT; // 테마가 하단 높이를 키울 수 있다(로고 등)
  const W=PW+PAD*2, H=PAD+SHOTS*PH+(SHOTS-1)*GAP+foot;
  cv.width=W*DPR; cv.height=H*DPR;
  const x=cv.getContext('2d'); x.scale(DPR,DPR);
  const baseY=PAD+SHOTS*PH+(SHOTS-1)*GAP;
  const geo={W,H,baseY,PAD,PW,PH,GAP,SHOTS,frame,filter,phrase,date,img:IMG,letterSpace};
  x.fillStyle=frame.bg; x.fillRect(0,0,W,H);
  list.forEach((s,i)=>x.drawImage(s, PAD, PAD+i*(PH+GAP), PW,PH));
  x.fillStyle=frame.txt; x.textAlign='center';
  // 하단(사진 아래)은 테마가 draw()로 통째로 가져간다. 없으면 기본 문구+날짜.
  if(T.draw) T.draw(x, geo);   // 사진 위에 얹히는 것(테두리·망점·로고·날짜)
  else{
    if(phrase){ x.font='600 17px Pretendard,sans-serif'; x.fillText(letterSpace(phrase,1), W/2, baseY+36); }
    x.globalAlpha=.6; x.font='400 12px Pretendard,sans-serif'; x.fillText(letterSpace(date,1), W/2, baseY+58); x.globalAlpha=1;
  }
}

function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on', s.id===id)); window.scrollTo(0,0); }

$('shoot').onclick=shoot;
$('retake').onclick=()=>show('capScreen');
setInterval(()=>{ if($('capScreen').classList.contains('on')) updatePreview(); }, 450);
// 테마 웹폰트가 늦게 뜨면 캔버스가 대체 폰트로 그려지므로, 로드 후 한 번 다시 그린다
if(document.fonts) document.fonts.ready.then(()=>{ if($('capScreen').classList.contains('on')) updatePreview(); });
$('download').onclick=()=>{
  $('strip').toBlob(b=>{
    const a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download=(T.slug||'photobooth')+'-'+Date.now()+'.png'; a.click(); URL.revokeObjectURL(a.href);
  },'image/png');
};
</script>
</body>
