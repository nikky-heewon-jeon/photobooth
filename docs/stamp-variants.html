<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>심의필 도장 디벨롭 안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<!-- 꽃 지면 위에서 심의필 도장이 안 읽히는 문제 — 6가지 처리 안. 실제 테마(../themes/seemefeel)로 그리고 도장만 다르게 찍는다. 컷에는 어두운 가짜 사진을 넣어 최악의 경우(어두운 사진 위)를 본다 -->
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f5f1;color:#141414;font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:14px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding:36px 20px 80px}
h1{font-size:24px;margin:0 0 6px;letter-spacing:-0.02em}
p.lead{margin:0 0 26px;color:#555}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:22px}
.card{background:#fff;border:2px solid #141414;padding:16px}
.card h2{font-size:16px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.card h2 b{display:inline-block;min-width:26px;height:26px;line-height:26px;text-align:center;background:#ca2b22;color:#fff;font-size:14px;border-radius:4px}
.card h2 b.ref{background:#7c756c}
.card p{margin:0 0 12px;font-size:13px;color:#444;min-height:40px}
.pair{display:flex;gap:10px;align-items:flex-start}
.pair canvas{display:block;border:1px solid #d9d6cf;background:#fff}
.pair .zoom{flex:1 1 auto;width:100%;height:auto}
.pair .full{flex:0 0 auto;width:72px;height:auto}
</style>
</head>
<body>
<div class="wrap">
<h1>심의필 도장 디벨롭 안</h1>
<p class="lead">꽃 지면(심의필 오리지날)에서 도장이 안 읽혀 6가지로 처리해 봤습니다. 큰 그림은 도장 부분 확대, 오른쪽 작은 그림은 스트립 전체입니다. 컷에는 어두운 사진을 넣어 가장 안 보이는 경우를 기준으로 했습니다. 번호로 골라 주세요.</p>
<div class="grid" id="grid"></div>
</div>
<script type="module">
import T from '../themes/seemefeel/theme.js';
const IMG={};
await Promise.all(Object.entries(T.images).map(([k,p])=>new Promise(r=>{const i=new Image(); i.onload=i.onerror=r; i.src='../themes/seemefeel/'+p; IMG[k]=i;})));
await document.fonts.ready;
const W=1080,H=3072, ST={cx:630,cy:2812,w:760,deg:-15}; // 테마 PTALL.stamp와 같은 값
const frame=T.frames.find(f=>f.id==='tall-p');
// 가짜 사진 — 어두운 방사형 그라데이션(포토부스 벽)
const shot=document.createElement('canvas'); shot.width=1200; shot.height=800;
{ const q=shot.getContext('2d'); const g=q.createRadialGradient(600,280,0,600,280,720); g.addColorStop(0,'#55534f'); g.addColorStop(.6,'#2a2928'); g.addColorStop(1,'#161616'); q.fillStyle=g; q.fillRect(0,0,1200,800); }
const tint=(im,color)=>{ const c=document.createElement('canvas'); c.width=im.naturalWidth||im.width; c.height=im.naturalHeight||im.height; const q=c.getContext('2d'); q.drawImage(im,0,0); q.globalCompositeOperation='source-in'; q.fillStyle=color; q.fillRect(0,0,c.width,c.height); return c; };
const rot=(x,f)=>{ x.save(); x.translate(ST.cx,ST.cy); x.rotate(ST.deg*Math.PI/180); f(); x.restore(); };
const stampH=ST.w*IMG.stamp.naturalHeight/IMG.stamp.naturalWidth;
function seal(x,{blend='multiply',alpha=.94,color,blur,w=ST.w}={}){ const h=w*IMG.stamp.naturalHeight/IMG.stamp.naturalWidth; rot(x,()=>{ x.globalAlpha=alpha; x.globalCompositeOperation=blend; if(blur) x.filter=`blur(${blur}px)`; x.drawImage(color?tint(IMG.stamp,color):IMG.stamp,-w/2,-h/2,w,h); }); }
function paper(mod){ const c=document.createElement('canvas'); c.width=W; c.height=H; const q=c.getContext('2d'); q.drawImage(IMG.paper,0,0,W,H); if(mod) mod(q); return c; }
const V=[
 {n:'현재',ref:true,t:'지금 상태',d:'꽃 지면 위에 multiply로 찍은 도장. 사진이 어두우면 위쪽 절반, 꽃 위에서는 아래쪽 절반이 묻힌다.',
  stamp:x=>seal(x)},
 {n:'1',t:'불투명 도장',d:'잉크처럼 스며들게(multiply) 하지 않고 그냥 위에 얹는다. 사진이 어두워도, 꽃 위에서도 빨강이 그대로 보인다.',
  stamp:x=>seal(x,{blend:'source-over'})},
 {n:'2',t:'흰 테두리 스티커',d:'도장 둘레에 흰 번짐을 두르고 불투명하게 얹는다. 어디에 찍혀도 또렷하고 스티커 느낌이 난다.',
  stamp:x=>{ rot(x,()=>{ x.shadowColor='rgba(255,255,255,.95)'; x.shadowBlur=24; const wt=tint(IMG.stamp,'#fff'); for(let i=0;i<3;i++) x.drawImage(wt,-ST.w/2,-stampH/2,ST.w,stampH); }); seal(x,{blend:'source-over'}); }},
 {n:'3',t:'종이 라벨 위에 도장',d:'도장 아래에 종이색 라벨(사선으로 같이 기울임)을 깔고 그 위에 원래대로 잉크 도장을 찍는다. 흰 종이 때의 느낌을 라벨 안에서 살린다.',
  stamp:x=>{ rot(x,()=>{ x.fillStyle='rgba(252,251,249,.96)'; x.shadowColor='rgba(0,0,0,.2)'; x.shadowBlur=16; x.shadowOffsetY=5; x.beginPath(); x.roundRect(-ST.w/2-36,-stampH/2-26,ST.w+72,stampH+52,10); x.fill(); }); seal(x); }},
 {n:'4',t:'빈티지 — 바랜 도장 + 지면 바램',d:'도장 자리의 지면을 안개처럼 살짝 희게 바래게 하고, 도장은 바랜 빨강으로 살짝 번지게 얹는다. 오래된 인쇄물 느낌.',
  paper:q=>{ const g=q.createRadialGradient(ST.cx,ST.cy,0,ST.cx,ST.cy,600); g.addColorStop(0,'rgba(255,255,255,.72)'); g.addColorStop(1,'rgba(255,255,255,0)'); q.fillStyle=g; q.fillRect(0,0,W,H); },
  stamp:x=>{ seal(x,{color:'#a8231a',alpha:.22,blend:'source-over',blur:2.5,w:ST.w+10}); seal(x,{color:'#a8231a',alpha:.8,blend:'source-over',blur:.7}); }}, // 번진 자국 한 겹 + 바랜 빨강(불투명이라 어두운 사진 위에서도 남는다)
 {n:'5',t:'아래 띠만 종이',d:'사진 아래 띠를 종이색으로 두고 꽃은 테두리와 컷 사이에만 남긴다. 도장은 원래대로 종이에 잉크로. 흰 종이 안과 꽃 지면 안의 중간.',
  paper:q=>{ q.fillStyle='#fcfbf9'; q.fillRect(0,2792,W,H-2792); }, stamp:x=>seal(x)},
 {n:'6',t:'꽃 지면을 연하게',d:'지면 전체를 흰색 45%로 눌러 앱 배경처럼 연한 꽃으로 만든다. 도장·사진이 앞으로 나오고 도장은 원래대로.',
  paper:q=>{ q.fillStyle='rgba(255,255,255,.45)'; q.fillRect(0,0,W,H); }, stamp:x=>seal(x)},
];
const grid=document.getElementById('grid');
for(const v of V){
  const full=document.createElement('canvas');
  T.compose(full,[shot,shot,shot,shot],{frame:{...frame,stamp:{key:'none'}},filter:T.filters[0],phrase:'',date:'',img:{...IMG,paper:paper(v.paper)},letterSpace:s=>s});
  v.stamp(full.getContext('2d'));
  const zoom=document.createElement('canvas'); zoom.width=W; zoom.height=900; zoom.getContext('2d').drawImage(full,0,H-900,W,900,0,0,W,900);
  const card=document.createElement('div'); card.className='card';
  card.innerHTML=`<h2><b class="${v.ref?'ref':''}">${v.n}</b>${v.t}</h2><p>${v.d}</p>`;
  const pair=document.createElement('div'); pair.className='pair'; zoom.className='zoom'; full.className='full'; pair.append(zoom,full); card.append(pair); grid.append(card);
}
</script>
</body>
</html>
